# Supabase CLI settings for this project's edge functions.
#
# verify_jwt = false means the gateway lets requests through without a Supabase session. Each of
# these functions either authenticates the caller itself or must be reachable without signing in:
#
#   account-deletion        public web page Google Play links to (visitors are signed out)
#   legal-pages             public policy pages Play Console links to
#   payments                gateway webhooks and callbacks carry no session; user routes check it
#   play-rtdn-webhook       Google Pub/Sub pushes, authenticated by RTDN_SHARED_SECRET
#   generate-stream-upload  checks the session itself (requireCaller)
#
# Every other function keeps the default, verify_jwt = true.

[functions.account-deletion]
verify_jwt = false

[functions.legal-pages]
verify_jwt = false

[functions.payments]
verify_jwt = false

[functions.play-rtdn-webhook]
verify_jwt = false

[functions.generate-stream-upload]
verify_jwt = false
