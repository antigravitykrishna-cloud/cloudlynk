<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7DFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#17243C"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="url(#lift)"/>

  <!-- The path's bounding box is x 10..95, y 15..72 — centre (52.5, 43.5), not
       (50, 50). Drawn as-authored it sits high and leaves a band of dead navy
       along the bottom. Re-centred on its real box and scaled to fill more of
       the tile, since a store icon is judged at 48px in a list. -->
  <g transform="translate(50,50) scale(1.1) translate(-52.5,-43.5)">
    <path d="M26 72 A16 16 0 0 1 26 44 A19 19 0 0 1 60 34 A21 21 0 0 1 74 72 Z" fill="url(#brand)"/>
    <path d="M45 46.5 L61 55 L45 63.5 Z" fill="#0B1220"/>
  </g>
</svg>
