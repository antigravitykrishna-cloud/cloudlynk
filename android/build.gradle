// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// SDK levels, pinned explicitly.
//
// Without this block they come from expo-root-project, which reads a Gradle
// version catalog named `expoLibs` and falls back to 35 when there isn't one.
// There is no catalog in this project, so the effective targetSdk was 35 —
// below the 36 Play now requires for new uploads, and the build would have
// been rejected after the fact rather than failing here.
//
// This works because the plugin uses `extra.setIfNotExist(...)`: whatever is
// already on the root project's ext wins, and this block runs before
// `apply plugin` below. Do not move it after that line.
ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    // expo-root-project would default this to 35.0.0, which is older than
    // compileSdk 36. AGP tolerates the mismatch most of the time and then
    // fails with an aapt2 or "Build Tools revision is corrupted" error that
    // points nowhere near the cause. Keep it level with compileSdk.
    buildToolsVersion = "36.0.0"
    // Pinned so a machine without it downloads this exact revision rather
    // than whatever the plugin default drifts to. ~1GB on first build.
    ndkVersion = "27.1.12297006"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
