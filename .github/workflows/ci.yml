name: CI

# Every push and PR. The app job is the same as `npm run check` locally, plus a JS bundle; the
# functions job typechecks the Supabase edge functions with Deno.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes the older run irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — typecheck, lint, test, guards, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: validate exactly the dependency tree in the lockfile.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --ci

      # Project rules tsc and eslint cannot express; each comes from a defect that shipped. See
      # scripts/guards.mjs.
      - name: Project guards
        run: node scripts/guards.mjs

      # Proves the JS bundle and the babel pipeline (including the reanimated plugin) build,
      # without the Android toolchain or a keystore. A broken worklet transform fails silently at
      # runtime, so this is the only place it would be caught before a device.
      - name: Bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          EXPO_NO_TELEMETRY: '1'
          # Placeholders: the bundler only needs them present. Real values are injected at build time.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key

  functions:
    name: Edge functions — deno check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none: the root package.json would otherwise make Deno resolve npm:
      # imports from the app's node_modules, which this job does not install. Edge functions get
      # their npm packages the way the Supabase runtime does, from the registry.
      - name: Typecheck
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

# Release builds are deliberately not here: they need the upload keystore, which does not belong
# in CI, and the bundle step already catches JS and babel breakage. See docs/guides/BUILD_LOCAL.md.
